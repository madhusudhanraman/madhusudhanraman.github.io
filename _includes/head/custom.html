<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true,
    processEnvironments: true,
    tags: 'ams',

    packages: {
      '[+]': ['youngtab']
    }
  },

  output: {
    font: 'mathjax-newcm'
  },

  startup: {
    ready() {

const Configuration =
  MathJax._.input.tex.Configuration.Configuration;

const CommandMap =
  MathJax._.input.tex.TokenMap.CommandMap;

const TexParser =
  MathJax._.input.tex.TexParser.default;

      /*
       * ------------------------------------------------------------
       * Settings
       * ------------------------------------------------------------
       */

      let lineThickness = '1pt';


      /*
       * ------------------------------------------------------------
       * Read \yng(...) and \young(...)
       * ------------------------------------------------------------
       */

      function getParenthesizedArgument(parser, name) {

        while (
          parser.i < parser.string.length &&
          /\s/.test(parser.string.charAt(parser.i))
        ) {
          parser.i++;
        }

        if (parser.string.charAt(parser.i) !== '(') {
          parser.Error(
            'MissingOpen',
            'Missing ( after %1',
            name
          );
        }

        parser.i++;

        const start = parser.i;
        let depth = 1;
        let braces = 0;

        while (parser.i < parser.string.length) {

          const c = parser.string.charAt(parser.i);

          if (c === '{') {
            braces++;
          }

          else if (c === '}') {
            braces--;
          }

          else if (braces === 0) {

            if (c === '(') {
              depth++;
            }

            else if (c === ')') {
              depth--;

              if (depth === 0) {
                const result =
                  parser.string.slice(
                    start,
                    parser.i
                  );

                parser.i++;

                return result;
              }
            }
          }

          parser.i++;
        }

        parser.Error(
          'MissingClose',
          'Missing ) for %1',
          name
        );
      }


      /*
       * ------------------------------------------------------------
       * Split rows of a tableau
       *
       * \young(abc,de,f)
       *          ^  ^
       * ------------------------------------------------------------
       */

      function splitRows(text) {

        const rows = [];
        let current = '';
        let braces = 0;

        for (let i = 0; i < text.length; i++) {

          const c = text.charAt(i);

          if (c === '{') {
            braces++;
            current += c;
          }

          else if (c === '}') {
            braces--;
            current += c;
          }

          else if (c === ',' && braces === 0) {
            rows.push(current);
            current = '';
          }

          else {
            current += c;
          }
        }

        rows.push(current);

        return rows;
      }


      /*
       * ------------------------------------------------------------
       * Split a row into tableau entries
       *
       * abc        -> a b c
       * {a_i}bc    -> a_i b c
       * \alpha bc  -> \alpha b c
       * ------------------------------------------------------------
       */

      function tokenizeRow(row) {

        const tokens = [];
        let i = 0;

        while (i < row.length) {

          /*
           * Ignore spaces.
           */
          if (/\s/.test(row.charAt(i))) {
            i++;
            continue;
          }


          /*
           * {...} is one cell.
           */
          if (row.charAt(i) === '{') {

            let depth = 1;
            let j = i + 1;

            while (
              j < row.length &&
              depth > 0
            ) {

              if (row.charAt(j) === '{') {
                depth++;
              }

              else if (row.charAt(j) === '}') {
                depth--;
              }

              j++;
            }

            tokens.push(
              row.slice(i + 1, j - 1)
            );

            i = j;
            continue;
          }


          /*
           * A TeX command is one cell.
           */
          if (row.charAt(i) === '\\') {

            let j = i + 1;

            while (
              j < row.length &&
              /[A-Za-z@]/.test(
                row.charAt(j)
              )
            ) {
              j++;
            }

            /*
             * Include a braced argument if there is one.
             */
            if (row.charAt(j) === '{') {

              let depth = 1;
              let k = j + 1;

              while (
                k < row.length &&
                depth > 0
              ) {

                if (row.charAt(k) === '{') {
                  depth++;
                }

                else if (row.charAt(k) === '}') {
                  depth--;
                }

                k++;
              }

              j = k;
            }

            tokens.push(
              row.slice(i, j)
            );

            i = j;
            continue;
          }


          /*
           * Ordinary character.
           */
          tokens.push(row.charAt(i));
          i++;
        }

        return tokens;
      }


      /*
       * ------------------------------------------------------------
       * Make a cell
       * ------------------------------------------------------------
       */

      function makeCell(parser, content) {

        /*
         * This is the important correction:
         *
         * MathJax 4 uses TexParser to parse the TeX inside
         * an individual cell.
         */
        const cellMath =
          new TexParser(
            content,
            parser.stack.env,
            parser.configuration
          ).mml();


        return parser.create(
          'node',
          'mrow',
          [cellMath],
          {
            class: 'youngtab-cell',
            style:
              'width:1.55em;' +
              'height:1.55em;' +
              'box-sizing:border-box;' +
              'display:inline-flex;' +
              'align-items:center;' +
              'justify-content:center;' +
              'border:' +
              lineThickness +
              ' solid currentColor;' +
              'margin-left:-' +
              lineThickness +
              ';' +
              'margin-top:-' +
              lineThickness +
              ';'
          }
        );
      }


      /*
       * ------------------------------------------------------------
       * Make a row
       * ------------------------------------------------------------
       */

      function makeRow(parser, entries) {

        const cells =
          entries.map(function (entry) {
            return makeCell(parser, entry);
          });


        return parser.create(
          'node',
          'mrow',
          cells,
          {
            class: 'youngtab-row',
            style:
              'display:flex;' +
              'height:1.55em;'
          }
        );
      }


      /*
       * ------------------------------------------------------------
       * \yng(3,2,1)
       * ------------------------------------------------------------
       */

      function Yng(parser, name) {

        const argument =
          getParenthesizedArgument(
            parser,
            name
          );

        const lengths =
          argument
            .split(',')
            .map(function (x) {
              return parseInt(
                x.trim(),
                10
              );
            })
            .filter(function (x) {
              return Number.isFinite(x) &&
                     x > 0;
            });


        const rows =
          lengths.map(function (length) {

            const entries = [];

            for (
              let i = 0;
              i < length;
              i++
            ) {
              entries.push(
                '\\phantom{1}'
              );
            }

            return makeRow(
              parser,
              entries
            );
          });


        const tableau =
          parser.create(
            'node',
            'mrow',
            rows,
            {
              class:
                'youngtab-tableau',
              style:
                'display:inline-block;' +
                'vertical-align:middle;' +
                'line-height:1;'
            }
          );


        parser.Push(tableau);
      }


      /*
       * ------------------------------------------------------------
       * \young(134,25)
       * ------------------------------------------------------------
       */

      function Young(parser, name) {

        const argument =
          getParenthesizedArgument(
            parser,
            name
          );


        const rows =
          splitRows(argument)
            .map(function (row) {
              return tokenizeRow(row);
            })
            .map(function (entries) {
              return makeRow(
                parser,
                entries
              );
            });


        const tableau =
          parser.create(
            'node',
            'mrow',
            rows,
            {
              class:
                'youngtab-tableau',
              style:
                'display:inline-block;' +
                'vertical-align:middle;' +
                'line-height:1;'
            }
          );


        parser.Push(tableau);
      }


      /*
       * ------------------------------------------------------------
       * \Ylinethick{1pt}
       * ------------------------------------------------------------
       */

      function Ylinethick(parser, name) {

        lineThickness =
          parser.GetArgument(name).trim();
      }


      /*
       * ------------------------------------------------------------
       * Command map
       *
       * MathJax 4 expects the map to point to handler names,
       * with the actual functions supplied separately.
       * ------------------------------------------------------------
       */

      new CommandMap(
        'youngtab',
        {
          yng: 'Yng',
          young: 'Young',
          Ylinethick: 'Ylinethick'
        },
        {
          Yng: Yng,
          Young: Young,
          Ylinethick: Ylinethick
        }
      );


      /*
       * Register the package.
       */

      Configuration.create(
        'youngtab',
        {
          handler: {
            macro: ['youngtab']
          }
        }
      );


      /*
       * Let MathJax continue with its normal startup.
       */

      MathJax.startup.defaultReady();
    }
  }
};
</script>

<script defer
  src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js">
</script>
